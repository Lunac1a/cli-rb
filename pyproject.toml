[project]
name = "cli-rb"
version = "0.1.0"
description = "Conversational coding agent — incremental implementation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langchain>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "rich>=13,<15",
  "prompt-toolkit>=3.0,<4",
  "typer>=0.16,<1",
  "httpx>=0.28,<1",
  "langgraph-checkpoint-sqlite>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
cli-rb = "cli_rb.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src/", "tests/", "README.md", "pyproject.toml", "uv.lock", "uv.toml", ".python-version"]

[tool.hatch.build.targets.wheel]
packages = ["src/cli_rb"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".cli-rb", ".idea", "main.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
